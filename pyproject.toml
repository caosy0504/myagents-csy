[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-agents-csy"
version = "0.2.1"
description = "A terminal-first Agent framework with tools and local RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
search = ["tavily-python>=0.8.0,<1.0.0"]
protocol-mcp = ["mcp>=2.2.0,<3.0.0"]
protocol-a2a = ["a2a-sdk[sqlite]>=1.1.5,<2.0.0"]
protocol = [
    "mcp>=2.2.0,<3.0.0",
    "a2a-sdk[sqlite]>=1.1.5,<2.0.0",
]
rag = [
    "markitdown>=0.1.0,<1.0.0",
    "qdrant-client==1.15.1",
    "sentence-transformers>=2.2.0,<7.0.0",
    "tiktoken>=0.5.0,<1.0.0",
]
rl = [
    "trl>=1.14.1,<1.15.0",
    "datasets>=4.0.0,<5.0.0",
    "peft>=0.17.0,<1.0.0",
    "accelerate>=1.0.0,<2.0.0",
]
evaluation = [
    "datasets>=4.7.0,<5.0.0",
    "huggingface-hub>=1.0.0,<2.0.0",
]
all = [
    "mcp>=2.2.0,<3.0.0",
    "a2a-sdk[sqlite]>=1.1.5,<2.0.0",
    "markitdown>=0.1.0,<1.0.0",
    "qdrant-client==1.15.1",
    "sentence-transformers>=2.2.0,<7.0.0",
    "tavily-python>=0.8.0,<1.0.0",
    "tiktoken>=0.5.0,<1.0.0",
    "trl>=1.14.1,<1.15.0",
    "datasets>=4.0.0,<5.0.0",
    "peft>=0.17.0,<1.0.0",
    "accelerate>=1.0.0,<2.0.0",
]
dev = ["pytest>=8.0.0,<10.0.0"]

[project.scripts]
my-agents = "my_agents.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["my_agents*"]

[tool.setuptools.package-data]
"my_agents.evaluation" = ["fixtures/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
